<!DOCTYPE html>
<html>
<head>
  <title>Day 9 – Events & Forms</title>
</head>
<body>

  <h2>Login Form</h2>
  <form id="loginFormElement">
    <input type="text" id="usernameInputElement" placeholder="Username" />
    <br /><br />
    <input type="password" id="passwordInputElement" placeholder="Password" />
    <br /><br />
    <button type="submit">Login</button>
  </form>

  <p id="loginMessageElement"></p>

  <hr />

  <h2>Email Validation</h2>
  <input type="text" id="emailInputElement" placeholder="Enter email" />
  <button id="emailCheckButtonElement">Check Email</button>
  <p id="emailMessageElement"></p>

  <hr />

  <h2>Character Counter</h2>
  <textarea id="textAreaInputElement" placeholder="Type something..."></textarea>
  <p id="charCountDisplayElement">Characters: 0</p>

  <script src="script.js"></script>
</body>
</html>
